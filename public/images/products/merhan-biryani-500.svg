<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="60%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>

    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <pattern id="archPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 C 10 12, 10 28, 20 40 C 30 28, 30 12, 20 0 Z" fill="none" stroke="#fbbf24" stroke-width="0.7" opacity="0.16" />
      <circle cx="20" cy="20" r="1.5" fill="#fbbf24" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Studio backdrop -->
  <rect width="600" height="600" fill="#f8fafc" />
  <radialGradient id="tableGlow" cx="50%" cy="55%" r="45%">
    <stop offset="0%" stop-color="#ffffff" />
    <stop offset="100%" stop-color="#f1f5f9" />
  </radialGradient>
  <rect width="600" height="600" fill="url(#tableGlow)" />
  <ellipse cx="300" cy="510" rx="210" ry="22" fill="#0f172a" opacity="0.12" filter="blur(6px)" />

  <!-- 3D Packaging Box -->
  <g transform="translate(100, 50)" filter="url(#boxShadow)">
    <!-- Box Front Face -->
    <rect x="0" y="0" width="400" height="450" rx="16" fill="url(#boxGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <rect x="0" y="0" width="400" height="450" rx="16" fill="url(#archPattern)" />

    <!-- Ornate Golden Border -->
    <rect x="14" y="14" width="372" height="422" rx="12" fill="none" stroke="url(#goldRibbon)" stroke-width="1.5" opacity="0.85" />
    <rect x="18" y="18" width="364" height="414" rx="10" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.4" />

    <!-- Top Badge Lockup -->
    <g transform="translate(200, 48)">
      <rect x="-85" y="-18" width="170" height="34" rx="8" fill="#b91c1c" stroke="#fef08a" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="3px">
        MERHAN
      </text>
    </g>

    <!-- Subtitle banner -->
    <text x="200" y="96" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5px">
      PAKET BERAS BASMATI PREMIUM
    </text>

    <!-- Main Title -->
    <text x="200" y="140" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, serif" font-size="28" font-weight="900" letter-spacing="2px">
      NASI BIRYANI
    </text>

    <text x="200" y="162" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="500">
      Beras Basmati Instan + Bumbu Lengkap
    </text>

    <!-- Central Illustrated Dish Window -->
    <g transform="translate(200, 255)">
      <!-- Outer gold ring -->
      <circle cx="0" cy="0" r="76" fill="#dc2626" stroke="url(#goldRibbon)" stroke-width="3" />
      <circle cx="0" cy="0" r="71" fill="#fff" opacity="0.1" />

      <!-- Dish inner art -->
      <ellipse cx="0" cy="12" rx="55" ry="32" fill="#d97706" opacity="0.9" />
      <ellipse cx="0" cy="10" rx="50" ry="28" fill="#fef08a" opacity="0.95" />
      
      <!-- Basmati grains texture -->
      <g stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.75">
        <line x1="-30" y1="5" x2="-22" y2="3" />
        <line x1="-15" y1="12" x2="-5" y2="10" />
        <line x1="10" y1="6" x2="22" y2="4" />
        <line x1="-8" y1="-2" x2="6" y2="-4" />
        <line x1="18" y1="14" x2="32" y2="10" />
        <line x1="-25" y1="18" x2="-14" y2="16" />
      </g>

      <!-- Center spice garnish -->
      <circle cx="0" cy="6" r="6" fill="#7f1d1d" />
      <circle cx="8" cy="12" r="4" fill="#15803d" />
      <circle cx="-10" cy="14" r="5" fill="#ca8a04" />

      <!-- Golden arc frame -->
      <path d="M -76 0 A 76 76 0 0 1 76 0" fill="none" stroke="url(#goldRibbon)" stroke-width="4" stroke-dasharray="14 6" />
    </g>

    <!-- Flavour Highlight Tag -->
    <g transform="translate(200, 355)">
      <rect x="-140" y="-12" width="280" height="25" rx="12" fill="rgba(0,0,0,0.6)" stroke="#fbbf24" stroke-width="0.8" />
      <text x="0" y="5" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
        ✨ Kaya Rempah Harum Berlapis
      </text>
    </g>

    <!-- Bottom Features &amp; Badges -->
    <line x1="30" y1="388" x2="370" y2="388" stroke="rgba(255,255,255,0.18)" stroke-width="1" />

    <g transform="translate(35, 416)">
      <!-- Halal Badge icon -->
      <rect x="0" y="-14" width="46" height="20" rx="4" fill="#047857" />
      <text x="23" y="0" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="900">HALAL</text>
    </g>

    <g transform="translate(90, 416)">
      <text x="0" y="0" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">
        Rice Cooker 25 Mnt
      </text>
    </g>

    <!-- Netto Weight Tag -->
    <g transform="translate(365, 416)">
      <rect x="-65" y="-14" width="65" height="22" rx="5" fill="url(#goldRibbon)" />
      <text x="-32" y="2" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="900">
        500g
      </text>
    </g>
  </g>
</svg>